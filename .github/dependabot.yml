version: 2

updates:
  # 1. Node.js / pnpm workspace dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata

    open-pull-requests-limit: 10

    labels:
      - dependencies
      - automated

    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

    groups:
      production-dependencies:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch

      development-dependencies:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # 2. GitHub Actions dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata

    open-pull-requests-limit: 5

    labels:
      - dependencies
      - github-actions

    commit-message:
      prefix: "chore(ci)"

    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # 3. Darshana Dockerfile dependencies
  - package-ecosystem: docker
    directory: /apps/darshana
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata

    open-pull-requests-limit: 5

    labels:
      - dependencies
      - docker

    commit-message:
      prefix: "chore(docker)"

  # 4. Moola Dockerfile dependencies
  - package-ecosystem: docker
    directory: /apps/moola
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata

    open-pull-requests-limit: 5

    labels:
      - dependencies
      - docker

    commit-message:
      prefix: "chore(docker)"

  # 5. Docker Compose dependencies
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata

    open-pull-requests-limit: 5

    labels:
      - dependencies
      - docker

    commit-message:
      prefix: "chore(compose)"
